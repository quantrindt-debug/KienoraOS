<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Hồ sơ & Thông tin Thiếu</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased p-6">
    <div class="max-w-6xl mx-auto space-y-6">
        <!-- Header -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">Quản lý Hồ sơ Học sinh & Cột BR</h1>
                <p class="text-sm text-slate-600 mt-1">Kiểm tra thông tin thiếu từ A đến BQ và lưu ghi chú cá nhân.</p>
            </div>
            <a href="dashboard.html" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl text-sm font-medium transition">← Về Trang Chủ</a>
        </div>

        <!-- Chọn lớp -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex items-center gap-4">
            <label class="font-semibold text-slate-700">Chọn lớp quản lý:</label>
            <select id="selectLop" class="border border-slate-300 rounded-xl px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none w-64" onchange="taiDuLieuLop()">
                <option value="">-- Chọn lớp học --</option>
            </select>
        </div>

        <!-- Thống kê & Chi tiết -->
        <div class="grid md:grid-cols-3 gap-6">
            <!-- Danh sách HS -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h3 class="font-bold text-slate-800 mb-3">Danh sách học sinh</h3>
                <div id="danhSachHSContainer" class="space-y-2 max-h-[500px] overflow-y-auto">
                    <span class="text-sm text-slate-400 italic">Vui lòng chọn lớp...</span>
                </div>
            </div>

            <!-- Chi tiết học sinh & Cột BR -->
            <div class="md:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                <h3 class="font-bold text-slate-800" id="tieuDeChiTietHS">Chi tiết thông tin thiếu (A đến BQ)</h3>
                <div id="chiTietHSCard" class="bg-slate-50 p-4 rounded-xl border border-slate-100 min-h-[100px]">
                    <p class="text-sm text-slate-400 italic">Chọn một học sinh bên trái để xem...</p>
                </div>

                <div id="khungNhanTinBR" class="hidden space-y-3 pt-3 border-t border-slate-200">
                    <label class="block text-sm font-medium text-slate-700">Ghi chú / Nhắn nhở (Lưu vào Cột BR):</label>
                    <textarea id="noiDungBR" rows="3" class="w-full border border-slate-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Nhập ghi chú..."></textarea>
                    <button onclick="luuNoiDungBR()" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-xl text-sm shadow-sm transition">Lưu vào Cột BR</button>
                </div>
            </div>
        </div>
    </div>

<!-- Script xử lý logic -->
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbx_JrmXio35cXobgk6TRrsRYCrfmCH2Lz7mjswM-mV-bPuObRu_smGR9ZrG2T-_qNsT/exec"; 
        let hocSinhDangChon = null;

        // Lấy mã trực tiếp từ URL (Ví dụ: file.html?maTruong=ABC&maNhanSu=123)
        const urlParams = new URLSearchParams(window.location.search);
        
        let currentSession = {
            maTruong: urlParams.get('maTruong') || "C3NDT",   // Thay mã thật vào đây nếu không truyền trên URL
            maNhanSu: urlParams.get('maNhanSu') || "GV0001" // Thay mã thật vào đây nếu không truyền trên URL
        };

        console.log("Thông tin định danh đang sử dụng:", currentSession);

        // Gọi ngay hàm lấy danh sách lớp
        function khoiTaoDuLieu() {
            const maTruong = currentSession.maTruong;
            const maNhanSu = currentSession.maNhanSu;

            fetch(`${API_URL}?action=layDanhSachLop&maTruong=${encodeURIComponent(maTruong)}&maNhanSu=${encodeURIComponent(maNhanSu)}`)
                .then(res => res.json())
                .then(data => {
                    console.log("Dữ liệu trả về:", data);
                    const select = document.getElementById('selectLop');
                    if(!select) return;
                    select.innerHTML = '<option value="">-- Chọn lớp học --</option>';
                    
                    const dsLop = data.danhSachLop || data.dsLop || data.classes; 
                    if (dsLop && Array.isArray(dsLop) && dsLop.length > 0) {
                        dsLop.forEach(lop => {
                            select.innerHTML += `<option value="${lop}">${lop}</option>`;
                        });
                    }
                })
                .catch(err => console.error("Lỗi kết nối API:", err));
        }

        // Chạy luôn khi load trang
        khoiTaoDuLieu();

        function taiDuLieuLop() {
            const selectLopEl = document.getElementById('selectLop');
            if (!selectLopEl) return;
            const tenLop = selectLopEl.value;
            if(!tenLop) return;

            fetch(`${API_URL}?action=kiemTraLop&tenLop=${encodeURIComponent(tenLop)}&maTruong=${encodeURIComponent(currentSession.maTruong)}&maNhanSu=${encodeURIComponent(currentSession.maNhanSu)}`)
                .then(res => res.json())
                .then(data => {
                    if (data.chiTietHS) {
                        hienThiDanhSachHS(data.chiTietHS);
                    }
                })
                .catch(err => console.error("Lỗi tải dữ liệu lớp:", err));
        }

        function hienThiDanhSachHS(danhSach) {
            const container = document.getElementById('danhSachHSContainer');
            if (!container) return;
            container.innerHTML = '';
            
            if(!danhSach || danhSach.length === 0) {
                container.innerHTML = '<span class="text-sm text-slate-400 italic">Không có học sinh.</span>';
                return;
            }
            
            danhSach.forEach(hs => {
                const soLuongThieu = hs.thieu ? hs.thieu.length : 0;
                const badgeColor = soLuongThieu === 0 ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700';
                
                const div = document.createElement('div');
                div.className = "p-3 bg-slate-50 hover:bg-blue-50 cursor-pointer rounded-xl border border-slate-100 flex justify-between items-center transition mb-2";
                div.innerHTML = `
                    <div>
                        <p class="text-sm font-semibold text-slate-800">${hs.tenHS}</p>
                        <p class="text-xs text-slate-500">Mã: ${hs.maHS}</p>
                    </div>
                    <span class="text-xs font-bold px-2 py-1 rounded-lg ${badgeColor}">${soLuongThieu} thiếu</span>
                `;
                div.onclick = () => chonHocSinh(hs);
                container.appendChild(div);
            });
        }

        function chonHocSinh(hs) {
            hocSinhDangChon = hs;
            const card = document.getElementById('chiTietHSCard');
            const khungBR = document.getElementById('khungNhanTinBR');
            const noiDungBR = document.getElementById('noiDungBR');

            if (khungBR) khungBR.classList.remove('hidden');
            if (noiDungBR) noiDungBR.value = hs.ghiChuBR || '';

            if (!card) return;
            if(!hs.thieu || hs.thieu.length === 0) {
                card.innerHTML = `<p class="text-sm text-emerald-600 font-semibold">Học sinh <strong>${hs.tenHS}</strong> đã hoàn thành đầy đủ thông tin từ A đến BQ!</p>`;
            } else {
                let htmlList = hs.thieu.map(c => `<span class="bg-rose-50 text-rose-600 border border-rose-100 text-xs px-2.5 py-1 rounded-lg font-medium">${c}</span>`).join(' ');
                card.innerHTML = `
                    <p class="text-sm font-semibold text-slate-800 mb-2">Học sinh: <span class="text-blue-600">${hs.tenHS}</span> còn thiếu các cột sau:</p>
                    <div class="flex flex-wrap gap-2">${htmlList}</div>
                `;
            }
        }

        function luuNoiDungBR() {
            if(!hocSinhDangChon) return;
            const noiDungEl = document.getElementById('noiDungBR');
            if (!noiDungEl) return;
            const noiDung = noiDungEl.value;

            fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ 
                    action: 'luuBR', 
                    rowNum: hocSinhDangChon.rowNum, 
                    noiDung: noiDung,
                    maTruong: currentSession.maTruong 
                })
            })
            .then(res => res.json())
            .then(res => {
                alert(res.message || "Đã lưu thành công!");
                hocSinhDangChon.ghiChuBR = noiDung;
                taiDuLieuLop();
            })
            .catch(err => console.error("Lỗi lưu cột BR:", err));
        }
    </script>
</body>
</html>

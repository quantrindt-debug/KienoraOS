<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Quản Lý Hồ Sơ Học Sinh</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .login-card h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #666; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .btn-login { width: 100%; padding: 10px; background: #007bff; border: none; color: white; font-size: 16px; border-radius: 4px; cursor: pointer; }
        .btn-login:hover { background: #0056b3; }
        #error-msg { color: red; text-align: center; margin-top: 10px; font-size: 14px; }
    </style>
    <!-- Thư viện Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="login-card">
        <h2>Đăng Nhập Hệ Thống</h2>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Mã nhân sự</label>
                <input type="text" id="username" required placeholder="Nhập mã nhân sự...">
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="password" required placeholder="Nhập mật khẩu...">
            </div>
            <button type="submit" class="btn-login">Đăng Nhập</button>
            <div id="error-msg"></div>
        </form>
    </div>

    <script>
        // Sử dụng cấu hình chuẩn từ dự án của bạn
        const SUPABASE_URL = 'https://ywccbfpyilwdpokgllus.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_YShqad87nsgJJT1TX5rbw_K5z048Jr';
        
        // Đặt tên biến là 'db' để tránh hoàn toàn việc bị trùng lặp tên với thư viện gốc
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleLogin(event) {
            event.preventDefault();
            
            const userIn = document.getElementById('username').value.trim();
            const passIn = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('error-msg');
            
            errorDiv.textContent = "Đang kiểm tra kết nối...";

            try {
                // Truy vấn vào bảng chứa dữ liệu người dùng
                let { data, error } = await db
                    .from('user')
                    .select('*')
                    .eq('ma_nhan_su', userIn)
                    .eq('mat_khau', passIn);

                if (error) throw error;

                if (data && data.length > 0) {
                    const user = data[0];
                    sessionStorage.setItem('currentUser', JSON.stringify(user));
                    alert("Đăng nhập thành công! Xin chào " + user.ho_va_ten);
                    window.location.href = 'KienronaOS1.html'; 
                } else {
                    errorDiv.textContent = "Sai mã nhân sự hoặc mật khẩu!";
                }
            } catch (err) {
                console.error("Lỗi đăng nhập:", err.message);
                errorDiv.textContent = "Lỗi kết nối CSDL: " + err.message;
            }
        }
    </script>
</body>
</html>

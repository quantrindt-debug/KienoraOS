<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập Hệ thống - KienoraOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900 min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-white/10 backdrop-blur-xl p-8 rounded-3xl shadow-2xl border border-white/20 text-white">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold tracking-wider text-blue-400">KienoraOS</h1>
            <p class="text-sm text-slate-300 mt-2">Hệ thống Quản lý Trường học Thông minh</p>
        </div>

        <!-- Đã sửa onsubmit gọi đúng hàm doLogin(event) -->
        <form onsubmit="doLogin(event)" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Tên đăng nhập / Tài khoản</label>
                <!-- Đã khớp id="accInput" -->
                <input type="text" id="accInput" required class="w-full bg-slate-800/50 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="VD: C3NDT.GV001">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Mật khẩu</label>
                <!-- Đã khớp id="passInput" -->
                <input type="password" id="passInput" required class="w-full bg-slate-800/50 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="••••••••">
            </div>

            <div id="thongBaoLoi" class="hidden text-xs text-rose-400 font-medium text-center bg-rose-950/50 p-2.5 rounded-lg border border-rose-800/50"></div>

            <!-- Đã bổ sung id="btnLogin" -->
            <button type="submit" id="btnLogin" class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl shadow-lg shadow-blue-600/30 transition duration-200">
                <span>XÁC THỰC & ĐĂNG NHẬP</span>
            </button>
        </form>

        <div class="mt-8 text-center text-xs text-slate-500">
            &copy; 2026 KienoraOS Education Management System.
        </div>
    </div>

    <!-- Nhúng đoạn code hàm doLogin(event) vào đây hoặc file js riêng -->
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxw9_IwDZqka0NzwFKX9KihjvTP2-EEBsNGzxVBrPn4vQJMXMfwFQtsQTsliPA0xaRa/exec";

        function doLogin(event) {
            if (event) event.preventDefault();

            const rawAcc = document.getElementById('accInput').value.trim();
            const pass = document.getElementById('passInput').value.trim();
            const btn = document.getElementById('btnLogin');

            if (!rawAcc || !pass) {
                showMsg("❌ Vui lòng nhập đầy đủ Mã Tài Khoản và Mật Khẩu!", "error");
                return;
            }

            const dotIndex = rawAcc.indexOf('.');
            if (dotIndex === -1) {
                showMsg("❌ Mẫu tài khoản chưa đúng! Phải có dấu chấm (VD: C3NDT.GV001)", "error");
                return;
            }

            const extractedMaTruong = rawAcc.substring(0, dotIndex).toUpperCase();
            const extractedMaNS = rawAcc.substring(dotIndex + 1);

            btn.disabled = true;
            btn.innerHTML = '<span>Đang xác thực...</span>';

            const requestUrl = `${API_URL}?action=login&account=${encodeURIComponent(rawAcc)}&password=${encodeURIComponent(pass)}&maTruong=${encodeURIComponent(extractedMaTruong)}`;

            fetch(requestUrl)
                .then(response => response.json())
                .then(res => {
                    btn.disabled = false;
                    btn.innerHTML = '<span>XÁC THỰC & ĐĂNG NHẬP</span>';

                    if (res.status === 'success') {
                        const sessionData = {
                            maTruong: extractedMaTruong,
                            maNhanSu: extractedMaNS,
                            token: res.token || (extractedMaTruong + "_" + new Date().getTime()),
                            ...res.user
                        };

                        localStorage.setItem('kienona_session', JSON.stringify(sessionData));
                        localStorage.setItem('kienona_school', JSON.stringify(res.school || { maTruong: extractedMaTruong }));

                        showMsg("✅ Đăng nhập thành công! Đang chuyển hướng...", "success");

                        setTimeout(() => {
                            window.location.href = "KienoraOS.html";
                        }, 500);

                    } else {
                        showMsg("❌ " + (res.message || "Tài khoản hoặc mật khẩu không chính xác!"), "error");
                    }
                })
                .catch(err => {
                    btn.disabled = false;
                    btn.innerHTML = '<span>XÁC THỰC & ĐĂNG NHẬP</span>';
                    showMsg("⚠️ Lỗi kết nối Máy chủ API: " + err.message, "error");
                });
        }

        function showMsg(message, type) {
            let thongBao = document.getElementById('thongBaoLoi');
            if (!thongBao) return;
            thongBao.classList.remove('hidden', 'text-rose-400', 'text-emerald-400');
            
            if (type === 'error') {
                thongBao.classList.add('text-rose-400');
            } else {
                thongBao.classList.add('text-emerald-400');
            }
            thongBao.innerText = message;
        }
    </script>
</body>
</html>

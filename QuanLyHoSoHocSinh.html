<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Test Lấy Danh Sách Lớp</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-10 bg-slate-100">
    <div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow">
        <h2 class="text-lg font-bold mb-4">Kiểm tra kết nối lớp học</h2>
        <label class="block text-sm font-medium mb-1">Chọn lớp:</label>
        <select id="selectLop" class="w-full border p-2 rounded">
            <option value="">-- Đang tải danh sách lớp... --</option>
        </select>
    </div>

    <script>
        // Thay link Web App của thầy vào đây
        const API_URL = "https://script.google.com/macros/s/AKfycbx_JrmXio35cXobgk6TRrsRYCrfmCH2Lz7mjswM-mV-bPuObRu_smGR9ZrG2T-_qNsT/exec";
        
        
        // Thay mã trường và mã nhân sự thật của thầy vào đây
        const maTruongTest = "C3NDT"; 
        const maNhanSuTest = "GV001";

        console.log("Bắt đầu chạy file test...");

        fetch(`${API_URL}?action=layDanhSachLop&maTruong=${encodeURIComponent(maTruongTest)}&maNhanSu=${encodeURIComponent(maNhanSuTest)}`)
            .then(res => res.json())
            .then(data => {
                console.log("Kết quả trả về từ Google Sheets:", data);
                const select = document.getElementById('selectLop');
                select.innerHTML = '<option value="">-- Chọn lớp học --</option>';
                
                const dsLop = data.danhSachLop || data.dsLop;
                if (dsLop && Array.isArray(dsLop) && dsLop.length > 0) {
                    dsLop.forEach(lop => {
                        select.innerHTML += `<option value="${lop}">${lop}</option>`;
                    });
                    alert("Đã tải thành công " + dsLop.length + " lớp vào ô chọn!");
                } else {
                    alert("Kết nối được nhưng không tìm thấy lớp nào cho mã này!");
                }
            })
            .catch(err => {
                console.error("Lỗi kết nối:", err);
                alert("Lỗi kết nối: " + err);
            });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Quản Lý Hồ Sơ Học Sinh</title>
    <!-- Sử dụng Tailwind CSS qua CDN để tạo giao diện hiện đại, chuyên nghiệp -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #1d4ed8 100%);
        }
        /* Hiệu ứng kính mờ (Glassmorphism) chuẩn phong cách KienoraOS */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }
        .glass-input:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(59, 130, 246, 0.8);
        }
    </style>
    <!-- Thư viện Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="flex items-center justify-center h-screen m-0">

    <div class="glass-card p-8 rounded-2xl shadow-2xl w-full max-w-[420px] text-slate-100">
        <!-- Logo / Tiêu đề thương hiệu -->
         <div class="text-center mb-8">
            <h1 class="text-3xl font-bold tracking-wider text-blue-400">KienoraOS</h1>
            <p class="text-sm text-slate-300 mt-2">Hệ thống Quản lý Trường học Thông minh</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
            <div class="form-group">
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Tên đăng nhập / Tài khoản</label>
                <input type="text" id="username" required placeholder="VD: c3ndtnl.nan.haitin" 
                    class="glass-input w-full px-4 py-3 rounded-xl text-sm placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
            </div>

            <div class="form-group">
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Mật khẩu</label>
                <input type="password" id="password" required placeholder="••••••••" 
                    class="glass-input w-full px-4 py-3 rounded-xl text-sm placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
            </div>

            <button type="submit" id="btnSubmit" class="btn-login w-full py-3.5 px-4 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl shadow-lg shadow-blue-600/40 transition-all duration-200 text-sm tracking-wide">
                Xác thực & Đăng nhập
            </button>

            <div id="error-msg" class="text-center text-xs font-medium text-rose-400 mt-3 min-h-[20px]"></div>
        </form>

        <div class="mt-8 pt-4 border-t border-white/10 text-center">
            <p class="text-[11px] text-slate-400">&copy; 2026 KienoraOS Education Management System.</p>
        </div>
    </div>

   <script>
        // Sử dụng cấu hình chuẩn từ dự án của bạn
        const SUPABASE_URL = 'https://ywccbfpyilwdpokgllus.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_YShqjad87nsgJJTlTX5rbw_K5zO48Jr';
        
        // Đặt tên biến là 'db' để tránh hoàn toàn việc bị trùng lặp tên với thư viện gốc
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleLogin(event) {
            event.preventDefault();
            
            const userIn = document.getElementById('username').value.trim();
            const passIn = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('error-msg');
            
            errorDiv.textContent = "Đang kiểm tra kết nối...";

            try {
                // Truy vấn vào bảng chứa dữ liệu người dùng
                let { data, error } = await db
                    .from('users')
                    .select('*')
                    .eq('ma_nhan_su', userIn)
                    .eq('mat_khau', passIn);

                if (error) throw error;

                if (data && data.length > 0) {
                    const users = data[0];
                    
                    // 1. Lưu vào sessionStorage (để các trang con gọi nếu cần)
                    sessionStorage.setItem('currentUser', JSON.stringify(users));
                    
                    // 2. Đóng gói dữ liệu chuẩn để trang KienoraOS nhận diện
                    const sessionData = {
                        maNhanSu: users.ma_nhan_su,
                        fullName: users.ho_va_ten,
                        vaiTro: users.quyen || 'Giáo viên' // Lấy cột 'quyen' làm vai trò
                    };

                    const schoolData = {
                        maTruong: users.ma_truong || "THPT_NGUYENDUYTRINH", // Lấy từ cột ma_truong hoặc mặc định
                        tenTruong: users.ten_truong || "Trường THPT Nguyễn Duy Trinh", // Tên trường
                        dbUrl: users.db_url || ""
                    };

                    // Lưu vào localStorage theo đúng cơ chế bảo mật của trang OS
                    localStorage.setItem('kienona_session', JSON.stringify(sessionData));
                    localStorage.setItem('kienona_school', JSON.stringify(schoolData));

                    // Thông báo đăng nhập thành công kèm vai trò
                    alert("Đăng nhập thành công!\nXin chào: " + users.ho_va_ten + "\nVai trò: " + (users.quyen || 'Giáo viên'));
                    
                    // Chuyển hướng sang trang OS của bạn
                    window.location.href = 'KienoraOS.html'; 
                } else {
                    errorDiv.textContent = "Sai mã nhân sự hoặc mật khẩu!";
                }
            } catch (err) {
                console.error("Lỗi đăng nhập:", err.message);
                errorDiv.textContent = "Lỗi kết nối CSDL: " + err.message;
            }
        }
    </script>
</body>
</html>

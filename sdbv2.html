        if (window.supabase) {

            console.error("Thư viện Supabase chưa được tải vào trang!");

        let currentRole = "";
        let isAdmin = false;

        // Lấy thông tin từ localStorage đồng nhất với OS (Hỗ trợ cả 2 chuẩn lưu trữ)
        let currentSession = {
            maNhanSu: localStorage.getItem('maNhanSu') || 
                      localStorage.getItem('taiKhoan') ||

            maTruong: function() {
                const sessionStr = localStorage.getItem('kienona_school');
                if (sessionStr) {
                    try {
                        const sData = JSON.parse(sessionStr);
                        if (sData.maTruong) return sData.maTruong;
                    } catch(e){}
                }
                const parts = this.maNhanSu.split('.');
                return parts.length >= 2 ? parts[0] + "." + parts[1] : "c3ndtnl.nan";
            }(),

            hoVaTen: "",
            tenTKB: "",
            vaiTro: "Giáo viên"
        };

        // 2. Truy vấn thông tin nhân sự, quyền và tên TKB từ Supabase
        async function taiVaiTro() {
    // 1. Lấy thông tin từ localStorage nếu có sẵn
    const savedSession = localStorage.getItem('kienona_session');
    if (savedSession) {
        try {
            const uData = JSON.parse(savedSession);
            if (uData.maNhanSu) currentSession.maNhanSu = uData.maNhanSu;
            if (uData.fullName) currentSession.hoVaTen = uData.fullName;
            if (uData.vaiTro) currentSession.vaiTro = uData.vaiTro;
        } catch(e){}
    }

    if (!db) return;

    try {
        // 2. Truy vấn trực tiếp vào bảng chứa thông tin nhân sự/user
        // (Nếu tên bảng của bạn là 'users' thì để 'users', nếu là tên khác như 'nhansu' thì thay vào đây)
        let { data, error } = await db
            .from('users') 
            .select('ma_nhan_su, ho_va_ten, quyen, ten_tkb')
            .eq('ma_nhan_su', currentSession.maNhanSu)
            .single();

        if (data && !error) {
            currentRole = String(data.quyen || "Giáo viên").trim();
            currentSession.vaiTro = currentRole;
            currentSession.hoVaTen = String(data.ho_va_ten || "").trim();
            
            // Lấy chính xác cột ten_tkb từ CSDL, nếu trống thì tự lấy phần đuôi mã nhân sự
            currentSession.tenTKB = String(data.ten_tkb || currentSession.maNhanSu.split('.').pop()).trim();
            
            const roleLower = currentRole.toLowerCase();
            isAdmin = roleLower.includes("admin") || roleLower.includes("quản trị");
            
            // Đưa thông tin lên giao diện ô input
            const inputGiaoVien = document.getElementById('inputGiaoVien');
            if (inputGiaoVien) {
                inputGiaoVien.value = currentSession.hoVaTen;
                inputGiaoVien.setAttribute('data-tentkb', currentSession.tenTKB);
            }
        }
    } catch (err) {
        console.warn("Không lấy được chi tiết từ CSDL, dùng giá trị mặc định:", err);
        currentSession.tenTKB = currentSession.maNhanSu ? currentSession.maNhanSu.split('.').pop() : '';
        currentRole = currentSession.vaiTro;
    }

    // 3. Kích hoạt hiển thị quyền và nạp TKB sau khi đã có dữ liệu chuẩn
    if (typeof hienThiQuyen === 'function') hienThiQuyen();
    if (typeof loadTKBIntoKeHoach === 'function') loadTKBIntoKeHoach();
}
        // 3. Hiển thị thông tin định danh và quyền lên giao diện
        function hienThiQuyen() {
            const badge = document.getElementById('userInfoBadge');
            if (badge) {
                badge.innerText = `Trường: ${currentSession.maTruong} | Tài khoản: ${currentSession.maNhanSu} | Tên: ${currentSession.hoVaTen || 'Cán bộ'} | Quyền: ${currentRole || 'Giáo viên'}`;
            }
        }

        // 4. Khởi chạy duy nhất 1 lần khi tải trang xong
        document.addEventListener("DOMContentLoaded", function() {
            taiVaiTro();         
            // Mặc định load tab Đăng TKB ngay khi vào trang
            switchTab('admin-tkb');
        });
// Hàm kiểm tra và ẩn các tab quản trị nếu user là Giáo viên
function checkUserPermission() {
    // Kiểm tra xem đã có thông tin session chưa
    if (typeof currentSession === 'undefined') return;

    // Lấy thông tin quyền (tùy thuộc vào cách bạn lưu, ví dụ 'quyen' hoặc 'role')
    const userRole = String(currentSession.quyen || currentSession.role || "").trim().toLowerCase();
    
    // Nếu là giáo viên (không phải admin/quản trị viên)
    if (userRole.includes('giáo viên') || userRole === 'gv' || userRole === 'teacher') {
        
        // 1. Ẩn nút/tab "Đăng TKB" trên giao diện (nếu có class hoặc id tương ứng)
        const tabDangTKB = document.querySelector('[data-tab="dang-tkb"]') || document.getElementById('btnDangTKB');
        if (tabDangTKB) {
            tabDangTKB.style.display = 'none'; // Ẩn hẳn đi
        }

        // 2. Ẩn menu quản trị bên trái (ví dụ mục Quản trị, phân cấp,...)
        const menuQuanTri = document.querySelectorAll('.admin-only, [data-role="admin"]');
        menuQuanTri.forEach(el => {
            el.style.display = 'none';
        });

        // 3. Nếu người dùng đang cố tình đứng ở tab quản trị, tự động chuyển về tab mặc định cho phép (ví dụ tab Kế hoạch Dạy Học)

        // Bạn có thể check nếu tab hiện tại là tab quản trị thì gọi hàm chuyển tab về Kế hoạch Dạy Học
    }
}

// 1. Tạo và tải file mẫu TKB Excel chuẩn cấu trúc
function downloadTKBTemplate() {
    const templateData = [
        ["STT", "Tuần học", "Thứ", "Buổi", "Tiết", "Lớp", "Môn học", "Giáo viên dạy"],
        [1, "TKB số 1", "Thứ 2", "Sáng", "Tiết 1", "12A", "Toán", "Nguyễn Văn A"]
    ];
    const ws = XLSX.utils.aoa_to_sheet(templateData);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "TKB");
    XLSX.writeFile(wb, "Mau_Dang_TKB_Chuan.xlsx");
}

// 2. Xử lý khi chọn file Excel TKB để bóc tách và hiển thị xem trước
function handleUploadTKB(input) {
    const file = input.files[0];
    if (!file) return;

    const selectSoTKB = document.getElementById('selectSoTKB');
    let targetSoTKB = selectSoTKB ? selectSoTKB.value.trim() : "TKB số 1";
    
    // Bóc tách tên TKB nếu dính tiền tố hiển thị
    if (targetSoTKB.includes("Thêm mới:")) {
        targetSoTKB = targetSoTKB.replace("➕ Thêm mới:", "").trim();
    } else if (targetSoTKB.includes("Xem / Ghi đè:")) {
        targetSoTKB = targetSoTKB.replace("📂 Xem / Ghi đè:", "").trim();
    }

    if (!targetSoTKB) {
        alert("Vui lòng chọn hoặc tạo Số TKB áp dụng ở phía trên trước khi tải file TKB lên!");
        input.value = "";
        return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const worksheet = workbook.Sheets[workbook.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
            
            if (rows.length < 6) {
                alert("File Excel không đúng cấu trúc TKB!");
                return;
            }

            const rowLop = rows[3]; 
            const rowBuoi = rows[4]; 
            
            let tkbParsedData = [];
            let sttCount = 1;
            const danhSachThu = ["Thứ 2", "Thứ 3", "Thứ 4", "Thứ 5", "Thứ 6", "Thứ 7"];

            for (let i = 5; i < rows.length; i++) {
                let r = rows[i];
                if (!r || r.length === 0) continue;

                let relativeRow = i - 5;
                let dayIndex = Math.floor(relativeRow / 5);
                let tietNum = (relativeRow % 5) + 1;

                if (dayIndex >= danhSachThu.length) break;

                let currentThu = danhSachThu[dayIndex];
                let tietHoc = "Tiết " + tietNum;

                for (let colIdx = 2; colIdx < r.length; colIdx++) {
                    let cellValue = r[colIdx];
                    if (cellValue && cellValue.toString().trim() !== "") {
                        let tenLop = rowLop[colIdx] || rowLop[colIdx - 1] || "";
                        if (!tenLop) continue;

                        let buoi = rowBuoi[colIdx] || (colIdx % 2 === 0 ? "Sáng" : "Chiều");
                        let parts = cellValue.toString().split('-');
                        let monHoc = parts[0] ? parts[0].trim() : cellValue;
                        let gvDich = parts[1] ? parts[1].trim() : "";

                        tkbParsedData.push({
                            stt: sttCount++,
                            so_tkb: targetSoTKB,
                            thu: currentThu,
                            buoi: buoi.trim(),
                            tiet: tietHoc,
                            lop: tenLop.toString().trim(),
                            mon: monHoc,
                            ten_tkb: gvDich,
                            ma_truong: (typeof currentSession !== 'undefined' && currentSession.maTruong) ? currentSession.maTruong : "c3ndtnl.nan"
                        });
                    }
                }
            }

            // Hiển thị xem trước lên bảng giao diện
            renderTKBTable(tkbParsedData);

            // Hỏi xác nhận trước khi đẩy lên Supabase
            if (confirm(`Đã bóc tách thành công ${tkbParsedData.length} tiết cho [${targetSoTKB}]. Bạn có muốn đồng bộ lưu lên hệ thống ngay không?`)) {
                uploadTKBToSupabase(tkbParsedData, targetSoTKB);
            }
        } catch (err) {
            alert("Lỗi xử lý file Excel: " + err.message);
        } finally {
            input.value = "";
        }
    };
    reader.readAsArrayBuffer(file);
}

// 3. Đẩy dữ liệu TKB trực tiếp lên Supabase
// 3. Đẩy dữ liệu TKB trực tiếp lên Supabase (Đã sửa bỏ ma_truong)
async function uploadTKBToSupabase(tkbArray, targetSoTKB) {
    if (!db) {
        alert("Chưa kết nối được cơ sở dữ liệu Supabase!");
        return;
    }

    const tbody = document.getElementById('tkbTableBody');
    if (tbody) {
        tbody.innerHTML = `<tr><td colspan="8" class="text-center py-10 text-indigo-600 font-medium animate-pulse">Đang đẩy dữ liệu lên hệ thống Supabase...</td></tr>`;
    }

    try {
        // Bước 1: Xóa dữ liệu cũ của TKB này (theo tuần/tên TKB) để ghi đè
        const { error: deleteError } = await db
            .from('thoi_khoa_bieu')
            .delete()
            .eq('so_tkb', targetSoTKB);

        if (deleteError) {
            console.warn("Cảnh báo khi xóa dữ liệu cũ:", deleteError.message);
        }

        // Bước 2: Chuẩn bị dữ liệu insert sang các cột chuẩn trong bảng thoi_khoa_bieu
        const recordsToInsert = tkbArray.map(item => ({
            so_tkb: item.so_tkb,
            thu: item.thu,
            buoi: item.buoi,
            tiet: item.tiet,
            lop: item.lop,
            mon: item.mon,
            ten_tkb: item.ten_tkb
        }));

        // Thực hiện Insert theo lô (chunks khoảng 500 bản ghi để tránh quá giới hạn)
        const batchSize = 500;
        for (let i = 0; i < recordsToInsert.length; i += batchSize) {
            const batch = recordsToInsert.slice(i, i + batchSize);
            const { error: insertError } = await db
                .from('thoi_khoa_bieu')
                .insert(batch);

            if (insertError) throw insertError;
        }

        alert("Đã lưu " + targetSoTKB + " lên hệ thống thành công!");
        initTKBWeekDropdown(); // Tải lại danh sách dropdown và dữ liệu mới nhất
    } catch (err) {
        alert("Lỗi khi lưu TKB lên Supabase: " + err.message);
        loadTKBData(); // Tải lại dữ liệu nếu lỗi
    }
}

// 6. Tải dữ liệu TKB từ Supabase xuống bảng theo lựa chọn (Đã sửa bỏ ma_truong)
async function loadTKBData() {

    const selectSoTKB = document.getElementById('selectSoTKB');
    let selectedVal = selectSoTKB ? selectSoTKB.value.trim() : "";
    
    if (!tbody) return;

    if (selectedVal.includes("Thêm mới:")) {
        selectedVal = selectedVal.replace("➕ Thêm mới:", "").trim();
    } else if (selectedVal.includes("Xem / Ghi đè:")) {
        selectedVal = selectedVal.replace("📂 Xem / Ghi đè:", "").trim();
    }

    tbody.innerHTML = `<tr><td colspan="8" class="text-center py-10 text-slate-400">Đang tải dữ liệu thời khóa biểu [${selectedVal || "Mặc định"}] từ hệ thống...</td></tr>`;

        return;
    }

    try {

            .from('thoi_khoa_bieu')
            .select('*');

        if (selectedVal) {
            // ĐÃ SỬA: Lọc theo cột 'so_tkb' thay vì 'tuan'
            query = query.eq('so_tkb', selectedVal);

        let { data, error } = await query;

        if (error) throw error;

            tbody.innerHTML = `<tr><td colspan="8" class="text-center py-10 text-slate-400">Chưa có dữ liệu cho mục [${selectedVal}]. Bạn có thể tải file Excel lên để thêm mới.</td></tr>`;

        console.error("Lỗi tải TKB:", err);
        tbody.innerHTML = `<tr><td colspan="8" class="text-center py-10 text-rose-500">Lỗi kết nối khi tải TKB: ${err.message}</td></tr>`;

}

// 5. Tải danh sách tuần / số TKB trực tiếp từ bảng thoi_khoa_bieu lên Dropdown
async function initTKBWeekDropdown() {
    const select = document.getElementById('selectSoTKB');
    if (!select) return;

    const currentSelectedValue = select.value;

    try {
        if (!db) throw new Error("Chưa kết nối Supabase");

        // ĐÃ SỬA: Truy vấn lấy danh sách cột 'so_tkb' thay vì 'tuan'
        let { data, error } = await db
            .from('thoi_khoa_bieu')
            .select('so_tkb');

        if (error) throw error;

        // Lọc lấy danh sách các số TKB duy nhất (không trùng lặp)
        let listSoTKB = [];
        if (data && data.length > 0) {
            const uniqueSoTKB = [...new Set(data.map(item => item.so_tkb || item.soTKB).filter(Boolean))];
            // Sắp xếp danh sách số TKB
            listSoTKB = uniqueSoTKB.sort((a, b) => {
                // Sắp xếp theo số nếu có, hoặc chuỗi thông thường
                return String(a).localeCompare(String(b), undefined, { numeric: true });
            });
        }

        let optionsHtml = '';
        
        // Đưa các số TKB đã có vào dropdown dưới dạng "Xem / Ghi đè"
        listSoTKB.forEach(item => {
            optionsHtml += `<option value="${item}">📂 Xem / Ghi đè: ${item}</option>`;
        });

        // Gợi ý tạo TKB tiếp theo dựa trên số lượng hiện có
        let nextNum = listSoTKB.length + 1;
        let goiYMoi = `TKB số ${nextNum}`;
        
        // Đưa tùy chọn "Thêm mới" lên đầu tiên
        optionsHtml = `<option value="${goiYMoi}">➕ Thêm mới: ${goiYMoi}</option>` + optionsHtml;
        select.innerHTML = optionsHtml;

        // Khôi phục lại lựa chọn cũ của người dùng nếu vẫn tồn tại
        if (currentSelectedValue && select.querySelector(`option[value="${CSS.escape(currentSelectedValue)}"]`)) {
            select.value = currentSelectedValue;
        } else {
            select.selectedIndex = 0;
        }

        // Tải dữ liệu của mục đang được chọn lên bảng
        if (typeof loadTKBData === 'function') loadTKBData();

    } catch (err) {
        console.warn("Không tải được danh sách TKB từ cơ sở dữ liệu, dùng mặc định:", err);
        select.innerHTML = `
            <option value="TKB số 1">➕ Thêm mới: TKB số 1</option>
            <option value="TKB số 2">📂 Xem / Ghi đè: TKB số 2</option>
        `;
        if (typeof loadTKBData === 'function') loadTKBData();
    }
}

// 1. Đẩy dữ liệu PPCT lên Supabase (Thay thế hàm uploadPPCTToGAS cũ)
async function uploadPPCTToSupabase(ppctArray) {
    const tbody = document.getElementById('ppctTableBody');
    if (tbody) {
        tbody.innerHTML = `<tr><td colspan="8" class="text-center py-10 text-indigo-600 font-medium animate-pulse">Đang đẩy dữ liệu PPCT lên Supabase...</td></tr>`;
    }

    if (!db) {
        alert("Chưa kết nối được cơ sở dữ liệu Supabase!");
        loadPPCTFromSupabase();
        return;
    }

    try {
        if (!ppctArray || ppctArray.length === 0) return;

        // Lấy thông tin khối và môn của bộ dữ liệu đang upload để xóa dữ liệu cũ cùng khối/môn trước khi ghi đè mới
        const sample = ppctArray[0];
        const targetKhoi = sample.khoi;
        const targetMon = sample.mon;
        const targetPhanMon = sample.phanMon || "";

        // Bước 1: Xóa dữ liệu cũ trùng Khối, Môn, Phân môn (nếu có) để tránh bị trùng lặp
        let deleteQuery = db.from('phan_phoi_chuong_trinh').delete().eq('khoi', targetKhoi).eq('mon', targetMon);
        if (targetPhanMon) {
            deleteQuery = deleteQuery.eq('phan_mon', targetPhanMon);
        }
        
        const { error: deleteError } = await deleteQuery;
        if (deleteError) {
            console.warn("Cảnh báo khi xóa dữ liệu PPCT cũ:", deleteError.message);
        }

        // Bước 2: Chuẩn bị dữ liệu insert khớp với các cột trong bảng Supabase
        const recordsToInsert = ppctArray.map(item => ({
            khoi: item.khoi,
            mon: item.mon,
            phan_mon: item.phanMon,
            tuan: item.tuan,
            tiet: item.tiet,
            ten_bai: item.tenBai,
            ghi_chu: item.ghiChu
        }));

        // Thực hiện Insert theo lô (chunks 500 bản ghi)
        const batchSize = 500;
        for (let i = 0; i < recordsToInsert.length; i += batchSize) {
            const batch = recordsToInsert.slice(i, i + batchSize);
            const { error: insertError } = await db
                .from('phan_phoi_chuong_trinh')
                .insert(batch);

            if (insertError) throw insertError;
        }

        alert("Đã lưu Phân phối chương trình lên hệ thống thành công!");
        loadPPCTFromSupabase(); // Tải lại toàn bộ dữ liệu mới nhất từ Supabase

    } catch (err) {
        alert("Lỗi khi lưu PPCT lên Supabase: " + err.message);
        loadPPCTFromSupabase();
    }
}

function handleUploadPPCT(input) {
    const file = input.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const worksheet = workbook.Sheets[workbook.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
            
            if (rows.length < 7) {
                alert("File Excel không đúng cấu trúc PPCT!");
                return;
            }

            
            // Lấy trực tiếp tên tường minh ở cột B (index 1) hoặc fallback sang cột D (index 3) nếu cần
            let rawKhoi = rows[1] ? (rows[1][1] || rows[1][3] || "") : "";
            let rawMon = rows[2] ? (rows[2][1] || rows[2][3] || "") : "";
            let rawPhanMon = rows[3] ? (rows[3][1] || rows[3][3] || "") : "";

            // Làm sạch chuỗi, nếu ô chứa chuỗi "Khối 10" thì có thể giữ nguyên hoặc rút gọn thành "10" cho khớp logic khối
            let khoi = rawKhoi.toString().replace(/[^0-9]/g, ""); // Lấy ra số khối (vd: "10") nếu muốn, hoặc để nguyên rawKhoi
            if (!khoi) khoi = rawKhoi.toString().trim();
            
            // Lấy tên môn tường minh (Ví: "Toán học" hoặc "Toán")
            let mon = rawMon.toString().trim();
            let phanMon = rawPhanMon.toString().trim();
            let ppctParsedData = [];
            let currentTuan = "";

            for (let i = 6; i < rows.length; i++) {
                let r = rows[i];
                if (!r || r.length === 0) continue;

                if (r[0] !== undefined && r[0] !== "" && r[0] !== null) {
                    currentTuan = r[0].toString().trim();
                }

                let tiet = r[1] !== undefined ? r[1] : "";
                let tenBai = r[2] !== undefined ? r[2] : "";
                let ghiChu = r[3] !== undefined ? r[3] : "";

                if (tiet !== "" || tenBai !== "") {
                    ppctParsedData.push({
                        stt: ppctParsedData.length + 1,
                        khoi: khoi.toString().trim(),
                        mon: mon.toString().trim(),
                        phanMon: phanMon.toString().trim(),
                        tuan: currentTuan,
                        tiet: tiet.toString().trim(),
                        tenBai: tenBai.toString().trim(),
                        ghiChu: ghiChu.toString().trim()
                    });
                }
            }

            if (ppctParsedData.length === 0) {
                alert("Không tìm thấy dữ liệu chi tiết bài học từ dòng 7 trở đi!");
                return;
            }

            if (confirm(`Đã bóc tách thành công ${ppctParsedData.length} dòng PPCT (Khối: ${khoi}, Môn: ${mon}). Bạn có muốn đồng bộ lên hệ thống không?`)) {
                uploadPPCTToSupabase(ppctParsedData);
            }

        } catch (err) {
            alert("Lỗi đọc file PPCT: " + err.message);
        } finally {
            input.value = "";
        }
    };
    reader.readAsArrayBuffer(file);
}

let allPPCTData = []; 

function filterPPCTData() {
    const selectedKhoi = document.getElementById('filterKhoi').value.trim().toLowerCase();
    const selectedMon = document.getElementById('filterMon').value.trim().toLowerCase();
    const selectPM = document.getElementById('filterPhanMon'); // ID của thẻ select Phân môn (bạn đổi tên nếu ID khác)

    if (!window.allPPCTData) return;

    // 1. Lọc dữ liệu theo Khối và Môn để tìm ra các Phân môn tương ứng
    let filtered = window.allPPCTData.filter(item => {
        let itemKhoi = item.khoi ? item.khoi.toString().trim().toLowerCase() : "";
        let itemMon = item.mon ? item.mon.toString().trim().toLowerCase() : "";

        let cleanSelectedKhoi = selectedKhoi.replace("khối", "").trim();
        let cleanItemKhoi = itemKhoi.replace("khối", "").trim();

        let matchKhoi = selectedKhoi === "" || cleanItemKhoi === cleanSelectedKhoi || itemKhoi.includes(selectedKhoi);
        let matchMon = selectedMon === "" || itemMon.includes(selectedMon);
        
        return matchKhoi && matchMon;
    });

    // 2. Cập nhật lại danh sách Phân môn đổ xuống theo Khối/Môn đang chọn
    if (selectPM) {
        let currentSelectedPM = selectPM.value; // Giữ lại giá trị đang chọn nếu có
        selectPM.innerHTML = '<option value="">-- Tất cả Phân môn --</option>';
        
        let uniquePhanMon = {};
        filtered.forEach(item => {
            let pm = item.phanMon ? item.phanMon.trim() : "";
            if (pm !== "") {
                uniquePhanMon[pm] = true;
            }
        });

        Object.keys(uniquePhanMon).forEach(pm => {
            let opt = document.createElement("option");
            opt.value = pm;
            opt.textContent = pm;
            selectPM.appendChild(opt);
        });

        // Khôi phục lại giá trị cũ nếu nó vẫn tồn tại trong danh sách mới
        if (uniquePhanMon[currentSelectedPM]) {
            selectPM.value = currentSelectedPM;
        }
    }

    // 3. Lọc tiếp theo Phân môn nếu có chọn cụ thể và vẽ lại bảng
    const selectedPhanMon = selectPM ? selectPM.value.trim().toLowerCase() : "";
    let finalFiltered = filtered.filter(item => {
        let itemPM = item.phanMon ? item.phanMon.trim().toLowerCase() : "";
        return selectedPhanMon === "" || itemPM === selectedPhanMon;
    });

    renderPPCTTable(finalFiltered);
}

            tuanSelect.innerHTML = '<option value="">-- Chọn tuần học --</option>';

            if (data && data.length > 0) {
                data.forEach(w => {
                    let tenTuanVal = w.ten_tuan; // Lấy đúng tên cột ten_tuan
                    let start = w.ngay_bat_dau || '';
                    let end = w.ngay_ket_thuc || '';

                    let opt = document.createElement('option');
                    opt.value = tenTuanVal; // Giá trị để so khớp/lưu
                    opt.textContent = `${tenTuanVal} (${start} - ${end})`; // Hiển thị đẹp kèm ngày tháng
                    
                    // Gắn thêm data attribute để khi chọn có thể hiển thị dòng "Thời gian tuần: ... đến ..."
                    opt.setAttribute('data-start', start);
                    opt.setAttribute('data-end', end);

                    tuanSelect.appendChild(opt);
                });

                // Nếu có sẵn dữ liệu, tự động chọn tuần đầu tiên hoặc tuần hiện tại nếu cần
                if (tuanSelect.options.length > 1) {
                    tuanSelect.selectedIndex = 1;
                    // Kích hoạt sự kiện thay đổi để load thông tin thời gian tuần tương ứng
                    tuanSelect.dispatchEvent(new Event('change'));
                }
            }
        })
        .catch(err => {
            console.warn("Lỗi tải danh sách tuần học cho Kế hoạch:", err.message);
        });
}

// 2. Tải TKB chỉ dựa vào so_tkb (Tuyệt đối không dùng cột tuan)
// 4. Lấy dữ liệu kế hoạch từ Supabase (Đã sửa lại logic lọc an toàn hơn)
async function fetchKeHoachFromSupabase(tuan, soTKB) {
    const tbody = document.getElementById('keHoachTableBody');
    const tenTKB = currentSession?.tenTKB || "";

    try {
        if (typeof db === 'undefined' || !db) throw new Error("Chưa kết nối Supabase");

        // Truy vấn cơ bản theo tuần và số TKB
        let query = db
            .from('ke_hoach_tuan')
            .select('*')
            .eq('tuan', tuan)
            .eq('so_tkb', soTKB);

        // Nếu không phải admin, lọc thêm theo tên TKB hoặc mã nhân sự của giáo viên đang đăng nhập
        if (!isAdmin && tenTKB) {
            // Hoặc bạn có thể dùng ma_nhan_su nếu bảng ke_hoach_tuan lưu cột ma_nhan_su
            query = query.eq('ten_tkb', tenTKB);
        }

        const { data, error } = await query;

        if (error) throw error;

        if (data && data.length > 0) {
            window.allKeHoachData = data;
            renderKeHoachTable(data);
        } else {
            // Nếu chưa có kế hoạch lưu sẵn, tự động chuyển sang nạp từ TKB gốc
            loadTKBIntoKeHoach();
        }
    } catch (err) {
        console.error("Lỗi tải kế hoạch từ Supabase:", err);
        if (tbody) tbody.innerHTML = `<tr><td colspan="12" class="text-center py-10 text-rose-500">Lỗi tải dữ liệu kế hoạch: ${err.message}</td></tr>`;
    }
}

// 5. Tải TKB và đồng bộ vào Kế hoạch (Đã sửa lỗi lọc đúng số TKB và đúng tuần)
async function loadTKBIntoKeHoach() {
    const selectSoTKB = document.getElementById('selectSoTKBKeHoach'); 
    const selectTuan = document.getElementById('filterKHTuan');         
    const tbody = document.getElementById('keHoachTableBody');

    ).trim().toLowerCase();

    }

    if (!db) {
        if (tbody) tbody.innerHTML = `<tr><td colspan="12" class="text-center py-6 text-rose-500">Lỗi: Chưa kết nối được cơ sở dữ liệu Supabase.</td></tr>`;

    }

    if (tbody) tbody.innerHTML = `<tr><td colspan="12" class="text-center py-6 text-slate-400">Đang tải TKB số ${soTKBValue} (Tuần ${tuanHienTaiNum}) và đồng bộ PPCT...</td></tr>`;

    const processTKBData = async () => {
        try {
            const normalizeStr = (str) => {
                return String(str || "").replace(/_/g, ' ').replace(/\s+/g, ' ').trim().toLowerCase();
            };

            // 1. Quét dữ liệu tiết lớn nhất từ các tuần trước (BẮT BUỘC KHỚP CHÍNH XÁC so_tkb và nhỏ hơn tuần hiện tại)
 // 1. Quét dữ liệu tiết lớn nhất từ tuần ngay trước đó (Không phân biệt so_tkb là số 1 hay số 2)
let maxTietTuanTruocMap = {}; 

if (tuanHienTaiNum > 1) {
    let maNS = currentSession?.maNhanSu || "";
    let tuanTruocCanTim = tuanHienTaiNum - 1; // Chỉ lấy đúng tuần ngay trước đó

    let queryTruoc = db
        .from('ke_hoach_tuan')
        .select('lop, mon, phan_mon, tiet_ppct, tuan, so_tkb')
        .eq('tuan', tuanTruocCanTim); // Lấy chính xác tuần liền kề trước (VD: đang ở tuần 2 thì lấy tuần 1)

    if (maNS) {
        queryTruoc = queryTruoc.eq('ma_nhan_su', maNS);
    }

    const { data: dataTuanTruoc, error: errTruoc } = await queryTruoc;
    
    if (!errTruoc && dataTuanTruoc && dataTuanTruoc.length > 0) {
        dataTuanTruoc.forEach(item => {
            let rawLop = String(item.lop || "").trim();
            let monTKB = String(item.mon || "").trim().toLowerCase();
            
            let tenLopChinh = rawLop;
            let phanMonTuanTruoc = "";
            if (rawLop.includes('-')) {
                let parts = rawLop.split('-');
                tenLopChinh = parts[0].trim();
                phanMonTuanTruoc = parts.slice(1).join('-').trim();
            }

            let normTenLopChinh = normalizeStr(tenLopChinh);
            let normPhanMon = normalizeStr(phanMonTuanTruoc || item.phan_mon);

            // Tạo key tổng quát để mapping sang TKB hiện tại (không phụ thuộc so_tkb cũ)
            let gKey = `${normTenLopChinh}_${monTKB}_${normPhanMon}`;
            let tVal = parseInt(item.tiet_ppct);

            if (!isNaN(tVal)) {
                if (!maxTietTuanTruocMap[gKey] || tVal > maxTietTuanTruocMap[gKey]) {
                    maxTietTuanTruocMap[gKey] = tVal;
                }
            }
        });
    }
}

            // 2. Tải thời khóa biểu gốc từ bảng thoi_khoa_bieu theo đúng so_tkb đang chọn
            // 2. Tải thời khóa biểu gốc từ bảng thoi_khoa_bieu (Đã tối ưu chuẩn hóa so_tkb)
const cleanSoTKB = soTKBValue.replace(/\D/g, ''); // Lọc lấy số (VD: "TKB số 2" -> "2")

const { data, error } = await db
    .from('thoi_khoa_bieu')
    .select('*')
    .or(`so_tkb.eq.${soTKBValue},so_tkb.eq.${cleanSoTKB}`); // Thử tìm cả dạng đầy đủ lẫn dạng số thuần túy

if (error) throw error;

if (data && data.length > 0) {
    let filteredData = data;
    
    // Nới lỏng lọc giáo viên (Khớp theo tên, mã nhân sự hoặc bỏ qua nếu là admin)
    // Lọc chuẩn xác giáo viên bằng so sánh tuyệt đối (tránh dùng includes bị bắt nhầm)
if (!isAdmin && tenTKBHienTai && tenTKBHienTai !== 'đang tải...') {
    filteredData = data.filter(item => {
        let gvTKB = String(item.ten_tkb || "").trim().toLowerCase();

        // Chỉ nhận khi khớp đúng tên TKB hoặc đúng mã nhân sự
        let matchTen = (gvTKB && tenTKBHienTai && gvTKB === tenTKBHienTai) || (gvTKB && sessionTenTKB && gvTKB === sessionTenTKB);
        let matchMa = (maNS && sessionMaNS && maNS === sessionMaNS);

        return matchTen || matchMa;
    });
}
    // ... các bước xử lý tiếp theo giữ nguyên

                if (filteredData.length === 0) {
                    if (tbody) tbody.innerHTML = `<tr><td colspan="12" class="text-center py-6 text-slate-400">Không tìm thấy tiết dạy nào trong "${soTKBValue}" ứng với giáo viên này.</td></tr>`;
                    return;
                }

                // Sắp xếp thứ tự thời khóa biểu trong tuần
                let tietCounterMap = {};
                const thuOrder = { 'Thứ 2': 2, 'Thứ 3': 3, 'Thứ 4': 4, 'Thứ 5': 5, 'Thứ 6': 6, 'Thứ 7': 7, 'Chủ nhật': 8 };
                const buoiOrder = { 'Sáng': 1, 'Chiều': 2, 'Tối': 3 };

                filteredData.sort((a, b) => {
                    let thuA = thuOrder[String(a.thu || "").trim()] || 99;
                    let thuB = thuOrder[String(b.thu || "").trim()] || 99;
                    if (thuA !== thuB) return thuA - thuB;

                    let buoiA = buoiOrder[String(a.buoi || "").trim()] || 99;
                    let buoiB = buoiOrder[String(b.buoi || "").trim()] || 99;
                    if (buoiA !== buoiB) return buoiA - buoiB;

                    let tietA = parseInt(String(a.tiet || "").replace(/\D/g, "")) || 0;
                    let tietB = parseInt(String(b.tiet || "").replace(/\D/g, "")) || 0;
                    return tietA - tietB;
                });

                // Thay thế đoạn map filteredData thành finalTKB bằng đoạn code chuẩn hóa này:

let finalTKB = filteredData.map(item => {
    let tietPPCT = "";
    let phanMon = "";
    let tenBaiDay = "";

    let rawLop = String(item.lop || "").trim();
    let monTKB = String(item.mon || "").trim().toLowerCase();
    
    let matchKhoi = rawLop.match(/\d+/);
    let khoiTKB = matchKhoi ? matchKhoi[0] : "";

    let tenLopChinh = rawLop;
    let loaiLopTKB = "";
    if (rawLop.includes('-')) {
        let parts = rawLop.split('-');
        tenLopChinh = parts[0].trim();
        loaiLopTKB = parts.slice(1).join('-').trim();
    }

    let normTenLopChinh = normalizeStr(tenLopChinh);
    let normLoaiLopTKB = normalizeStr(loaiLopTKB);
    
    let groupKey = `${soTKBValue}_${normTenLopChinh}_${monTKB}_${normLoaiLopTKB}`;

    if (tietCounterMap[groupKey] === undefined) {
        let baseOffset = maxTietTuanTruocMap[groupKey] || 0;
        tietCounterMap[groupKey] = baseOffset;
    }
    
    let currentTietIndex = ++tietCounterMap[groupKey];

    // Khớp PPCT chính xác, chỉ lấy 1 dòng tương ứng
    if (window.allPPCTCache && Array.isArray(window.allPPCTCache)) {
        let matchedList = window.allPPCTCache.filter(p => {
            let pKhoi = String(p.khoi || "").trim();
            let pMon = String(p.mon || "").trim().toLowerCase();
            let pPhanMon = normalizeStr(p.phan_mon || p.phanMon || p.phan_hoc || "");

            let checkKhoi = (pKhoi === khoiTKB);
            let checkMon = (pMon === monTKB) || pMon.includes(monTKB);
            let checkPhanMon = true;

            if (normLoaiLopTKB) {
                checkPhanMon = pPhanMon.includes(normLoaiLopTKB) || normLoaiLopTKB.includes(pPhanMon);
            }

            return checkKhoi && checkMon && checkPhanMon;
        });

        // Lấy đúng phần tử theo chỉ mục tiết hiện tại, nếu vượt quá thì lấy phần tử cuối cùng
        let matchedPPCT = matchedList[currentTietIndex - 1] || matchedList[0];

        if (matchedPPCT) {
            tietPPCT = matchedPPCT.tiet || matchedPPCT.tiet_ppct || currentTietIndex;
            phanMon = matchedPPCT.phan_mon || matchedPPCT.phanMon || matchedPPCT.phan_hoc || loaiLopTKB;
            tenBaiDay = matchedPPCT.ten_bai || matchedPPCT.ten_bai_hoc || matchedPPCT.noi_dung || "";
        } else {
            tietPPCT = currentTietIndex;
            phanMon = loaiLopTKB; 
            tenBaiDay = "";
        }
    }

    return {
        ...item,
        tuan: tuanHienTaiNum,
        so_tkb: soTKBValue,
        ten_tkb: item.ten_tkb || tenTKBHienTai,
        tiet_ppct: item.tiet_ppct || tietPPCT || "",
        phan_mon: item.phan_mon || phanMon || "",
        ten_bai: item.ten_bai || tenBaiDay || "",
        thiet_bi: item.thiet_bi || "",
        ghi_chu: item.ghi_chu || "",
        trang_thai: "Bình thường"
    };
});

                window.allKeHoachData = finalTKB;
                if (typeof renderKeHoachTable === 'function') {
                    renderKeHoachTable(finalTKB);
                }
            } else {
                if (tbody) tbody.innerHTML = `<tr><td colspan="12" class="text-center py-6 text-slate-400">Không tìm thấy dữ liệu TKB cho số: "${soTKBValue}".</td></tr>`;
            }
        } catch (err) {
            console.error("Lỗi tải TKB:", err);
            if (tbody) tbody.innerHTML = `<tr><td colspan="12" class="text-center py-6 text-rose-500">Lỗi kết nối khi tải TKB: ${err.message}</td></tr>`;
        }
    };

    if (!window.allPPCTCache || window.allPPCTCache.length === 0) {
        db.from('phan_phoi_chuong_trinh')
          .select('*')
          .limit(2000)
          .then(({ data, error }) => {
              if (!error && data) {
                  window.allPPCTCache = data;
              }
              processTKBData();
          });
    } else {
        processTKBData();
    }
}

// 8. Xử lý khi thay đổi tiết PPCT trực tiếp trên ô nhập
function onTietPPCTChange(input) {
    const tr = input.closest('tr');
    if (!tr) return;

    const lop = tr.querySelector('.td-lop')?.innerText.trim() || "";
    const mon = tr.querySelector('.td-mon')?.innerText.trim() || "";
    const tietTKB = tr.children[2]?.innerText.trim() || "";
    const thu = tr.children[0]?.innerText.trim() || "";
    const tietPPCT = input.value.trim();

    let khoiMatch = lop.match(/\d+/);
    let khoi = khoiMatch ? khoiMatch[0] : '';

    if (khoi && mon && tietPPCT) {
        tuDongXacDinhPhanMonVaDienTenBai(tr, khoi, mon, tietPPCT, lop);
    }

    if (window.allKeHoachData) {
        const foundItem = window.allKeHoachData.find(item => 
            String(item.lop).trim() === lop && 
            String(item.mon).trim() === mon && 
            String(item.thu).trim() === thu && 
            String(item.tiet).trim() === tietTKB
        );
        
        if (foundItem) {
            foundItem.tietPPCT = tietPPCT;
            foundItem.phanMon = tr.querySelector('.input-phanmon')?.value.trim() || "";
            foundItem.tenBai = tr.querySelector('.input-tenbai')?.value.trim() || "";
        }
    }
}

        const thietBiEl = tr.querySelector('.input-thietbi');
        const ghiChuEl = tr.querySelector('.input-ghichu');
        const trangThaiEl = tr.querySelector('.select-trangthai');
        
        rowsToInsert.push({
            tuan: tuanNum, // Đảm bảo luôn là số nguyên hợp lệ (1, 2, 3...)
            so_tkb: soTKB,
            ma_nhan_su: maNhanSu,
            thu: tr.querySelector('td:nth-child(1)') ? tr.querySelector('td:nth-child(1)').innerText.trim() : '',
            buoi: tr.querySelector('td:nth-child(2)') ? tr.querySelector('td:nth-child(2)').innerText.trim() : '',
            tiet: tr.querySelector('td:nth-child(3)') ? tr.querySelector('td:nth-child(3)').innerText.trim() : '',
            lop: lopEl ? (lopEl.getAttribute('data-val') || lopEl.innerText.trim()) : '',
            mon: monEl ? (monEl.getAttribute('data-val') || monEl.innerText.trim()) : '',
            tiet_ppct: tietPPCTEl ? tietPPCTEl.value.trim() : '',
            phan_mon: phanMonEl ? phanMonEl.value.trim() : '',
            ten_bai: tenBaiEl ? tenBaiEl.value.trim() : '',
            thiet_bi: thietBiEl ? thietBiEl.value.trim() : '',
            ghi_chu: ghiChuEl ? ghiChuEl.value.trim() : '',
            trang_thai: trangThaiEl ? trangThaiEl.value : 'Bình thường'
        });
    });

    try {
        if (typeof db === 'undefined' || !db) throw new Error("Chưa kết nối Supabase");

        // 1. Xóa dữ liệu cũ của đúng tuần, số TKB và giáo viên này trước khi ghi mới
        const { error: deleteError } = await db
            .from('ke_hoach_tuan')
            .delete()
            .eq('tuan', tuanNum)
            .eq('so_tkb', soTKB)
            .eq('ma_nhan_su', maNhanSu);

        if (deleteError) {
            console.warn("Cảnh báo khi xóa dữ liệu cũ:", deleteError.message);
        }

        // 2. Chèn mới toàn bộ danh sách dữ liệu hiện tại lên bảng
        const { error: insertError } = await db
            .from('ke_hoach_tuan')
            .insert(rowsToInsert);

        if (insertError) throw insertError;

        alert("💾 Lưu kế hoạch thành công lên Supabase!");
    } catch (err) {
        console.error("Lỗi khi lưu kế hoạch:", err);
        alert("❌ Lỗi khi lưu kế hoạch lên cơ sở dữ liệu: " + err.message);
    }
}

function saveSoDauBai() {
    const tuan = document.getElementById('filterSDBTuan').value;
    const inputGv = document.getElementById('inputGiaoVien');
    const maNhanSu = inputGv ? inputGv.getAttribute('data-manhansu') : (typeof currentSession !== 'undefined' ? currentSession.maNhanSu : '');
    
    const rows = [];
    document.querySelectorAll('#soDauBaiTableBody tr').forEach(tr => {
        const checkbox = tr.querySelector('.checkbox-ky');
        if (!checkbox) return;

        const isChecked = checkbox.checked;
        const siSoVangEl = tr.querySelector('.input-siso-vang');
        const tenHSVangEl = tr.querySelector('.input-ten-hvang');
        const nhanXetEl = tr.querySelector('.input-nhanxet');
        const diemEl = tr.querySelector('.input-diem');
        const xepLoaiEl = tr.querySelector('.input-xeploai');
        
        // Lấy thông tin thô từ cột 0 và 1
        const colThuBuoi = tr.children[0] ? tr.children[0].innerText.split('\n') : [];
        // Lấy toàn bộ phần trước dấu ngoặc đơn (Ví dụ: "Thứ 4 (Chiều)" -> lấy "Thứ 4")
        const thu = colThuBuoi[0] ? colThuBuoi[0].split('(')[0].trim() : '';
        const buoi = colThuBuoi[0] && colThuBuoi[0].includes('(') ? colThuBuoi[0].match(/\((.*?)\)/)[1] : '';
        const tiet = colThuBuoi[1] ? colThuBuoi[1].replace('Tiết ', '').trim() : '';
        
        const lopSpan = tr.children[1] ? tr.children[1].querySelector('span') : null;
        const monDiv = tr.children[1] ? tr.children[1].querySelector('div') : null;
        const lop = lopSpan ? lopSpan.innerText.trim() : '';
        const mon = monDiv ? monDiv.innerText.trim() : '';
        
        // Lấy thông tin tiết PPCT và tên bài từ cột 2
        const tietPPCTEl = tr.children[2] ? tr.children[2].querySelector('.font-semibold') : null;
        const tietPPCT = tietPPCTEl ? tietPPCTEl.innerText.replace('Tiết ', '').replace(':', '').trim() : '';
        
        const phanMonEl = tr.children[2] ? tr.children[2].querySelector('span.bg-blue-50') : null;
        const phanMon = phanMonEl ? phanMonEl.innerText.trim() : '';

        const tenBaiDiv = tr.children[2] ? tr.children[2].querySelector('.text-slate-700') : null;
        const tenBai = tenBaiDiv ? tenBaiDiv.innerText.trim() : '';

        rows.push({
            tuan: tuan,
            maNhanSu: maNhanSu,
            thu: thu,
            buoi: buoi,
            tiet: tiet,
            lop: lop,
            mon: mon,
            tietPPCT: tietPPCT,
            phanMon: phanMon,
            tenBai: tenBai,
            siSoVang: siSoVangEl ? siSoVangEl.value : "0",
            tenHSVang: tenHSVangEl ? tenHSVangEl.value : "",
            nhanXet: nhanXetEl ? nhanXetEl.value : "",
            diem: diemEl ? diemEl.value : "",
            xepLoai: xepLoaiEl ? xepLoaiEl.value : "Tốt",
            trangThaiKy: isChecked ? "Đã ký" : "Chưa ký",
            giaoVienKy: maNhanSu,
            thoiGianKy: new Date().toLocaleString("vi-VN")
        });
    });

    const payload = {
        action: "saveSoDauBai",
        tuan: tuan,
        maNhanSu: maNhanSu,
        rows: rows
    };

    fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
    })
    .then(async res => {
        const text = await res.text();
        try {
            return JSON.parse(text);
        } catch (e) {
            console.error("Dữ liệu trả về không phải JSON thuần:", text);
            throw new Error("Server trả về dữ liệu lỗi (không phải định dạng JSON).");
        }
    })
    .then(res => {
        if (res && res.success) {
            alert("💾 " + res.message);
            loadSoDauBai(); 
        } else {
            alert("❌ Lỗi khi ký sổ: " + (res ? res.message : "Không rõ nguyên nhân"));
        }
    })
    .catch(err => {
        console.error(err);
        alert("Lỗi kết nối hoặc xử lý dữ liệu: " + err.message);
    });
}

// Hàm tự động nạp danh sách vào các dropdown bộ lọc
function populateDropdowns(data) {
    const tuanSet = new Set(); // Set cho Tuần
    const gvSet = new Set();
    const monSet = new Set();
    const phanMonSet = new Set();
    const lopSet = new Set();
    
    data.forEach(item => {
        if(item.tuan) tuanSet.add(item.tuan);
        if(item.giaoVien) gvSet.add(item.giaoVien);
        if(item.monHoc) monSet.add(item.monHoc);
        if(item.phanMon) phanMonSet.add(item.phanMon);
        if(item.lop) lopSet.add(item.lop);
    });
    
    // Nạp dropdown Tuần (Sắp xếp theo thứ tự số nếu có)
    const selectTuan = document.getElementById('filterBCCoGiTuan');
    if(selectTuan) {
        selectTuan.innerHTML = '<option value="">-- Tất cả Tuần --</option>';
        Array.from(tuanSet).sort((a, b) => {
            // Cố gắng tách số từ chuỗi tuần (VD: "Tuần 1", "1"...) để sắp xếp tự nhiên
            let numA = parseInt(a.toString().replace(/\D/g, '')) || 0;
            let numB = parseInt(b.toString().replace(/\D/g, '')) || 0;
            return numA - numB;
        }).forEach(tuan => {
            selectTuan.innerHTML += `<option value="${tuan}">Tuần: ${tuan}</option>`;
        });
    }

    // Nạp các dropdown khác như cũ...
    const selectGV = document.getElementById('filterBCCoGiGV');
    if(selectGV) {
        selectGV.innerHTML = '<option value="">-- Tất cả Giáo Viên --</option>';
        Array.from(gvSet).sort().forEach(ten_tkb => {
            selectGV.innerHTML += `<option value="${ten_tkb}">${ten_tkb}</option>`;
        });
    }
    
    const selectMon = document.getElementById('filterBCCoGiMon');
    if(selectMon) {
        selectMon.innerHTML = '<option value="">-- Tất cả Môn Học --</option>';
        Array.from(monSet).sort().forEach(mon => {
            selectMon.innerHTML += `<option value="${mon}">${mon}</option>`;
        });
    }

    const selectPhanMon = document.getElementById('filterBCCoGiPhanMon');
    if(selectPhanMon) {
        selectPhanMon.innerHTML = '<option value="">-- Tất cả Phân Môn --</option>';
        Array.from(phanMonSet).sort().forEach(pm => {
            selectPhanMon.innerHTML += `<option value="${pm}">${pm}</option>`;
        });
    }
    
    const selectLop = document.getElementById('filterBCCoGiLop');
    if(selectLop) {
        selectLop.innerHTML = '<option value="">-- Tất cả Lớp --</option>';
        Array.from(lopSet).sort().forEach(lop => {
            selectLop.innerHTML += `<option value="${lop}">${lop}</option>`;
        });
    }
}

// Hàm lọc cập nhật thêm điều kiện Tuần
function filterBaoCaoTable() {
    const tuanKey = document.getElementById('filterBCCoGiTuan').value; // Lấy giá trị Tuần lọc
    const gvKey = document.getElementById('filterBCCoGiGV').value;
    const monKey = document.getElementById('filterBCCoGiMon').value;
    const phanMonKey = document.getElementById('filterBCCoGiPhanMon').value;
    const lopKey = document.getElementById('filterBCCoGiLop').value;
    const ttKey = document.getElementById('filterBCCoGiTrangThai').value;
    
    currentFilteredData = globalBaoCaoData.filter(item => {
        const matchTuan = !tuanKey || String(item.tuan) === String(tuanKey); // So khớp Tuần
        const matchGV = !gvKey || item.giaoVien === gvKey;
        const matchMon = !monKey || item.monHoc === monKey;
        const matchPhanMon = !phanMonKey || item.phanMon === phanMonKey;
        const matchLop = !lopKey || item.lop === lopKey;
        
        let matchTT = true;
        if(ttKey === 'chua-ky') matchTT = !item.daKy;
        if(ttKey === 'da-ky') matchTT = item.daKy;
        
        return matchTuan && matchGV && matchMon && matchPhanMon && matchLop && matchTT;
    });
    
    document.getElementById('countBaoCao').innerText = currentFilteredData.length;
    renderBaoCaoTable(currentFilteredData);
}

    });
}



function xuatExcelBaoCao() {
    if(globalBaoCaoData.length === 0) {
        alert("Không có dữ liệu để xuất file!");
        return;
    }
    
    // Chuẩn hóa mảng dữ liệu sang định dạng SheetJS
    const exportData = globalBaoCaoData.map((item, index) => ({
        "STT": index + 1,
        "Tuần": item.tuan,
        "Giáo Viên": item.giaoVien,
        "Môn Học": item.monHoc,
        "Phân Môn Học": item.phanmonHoc,
        "Lớp": item.lop,
        "Tiết": item.tiet,
        "Nội Dung Kế Hoạch": item.noiDung,
        "Trạng Thái Ký Sổ": item.daKy ? "Đã ký sổ đầu bài" : "Chưa ký sổ đầu bài"
    }));
    
    const worksheet = XLSX.utils.json_to_sheet(exportData);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "BaoCaoTietDay");
    
    // Xuất file Excel (.xlsx)
    XLSX.writeFile(workbook, "Bao_Cao_Thuc_Hien_Day_Hoc.xlsx");
}
// Hàm mới: Thống kê tổng số tiết theo từng Giáo Viên và Phân Môn dựa trên kết quả đang lọc
function xuatBaoCaoTongHopGV() {
    // Nếu chưa lọc hoặc danh sách trống
    const dataToProcess = currentFilteredData.length > 0 ? currentFilteredData : globalBaoCaoData;
    
    if(dataToProcess.length === 0) {
        alert("Không có dữ liệu để tổng hợp!");
        return;
    }
    
    // Gom nhóm theo Cặp Khóa: Giáo Viên + Phân Môn (để tách bạch Chính khóa, Ôn tập, BDHSG...)
    const summaryMap = {};
    
    dataToProcess.forEach(item => {
        const ten_tkb = item.giaoVien || "Chưa xác định";
        const phanMon = item.phanMon || "Chính khóa / Mặc định"; // Tránh để trống
        
        // Tạo khóa duy nhất cho mỗi giáo viên theo từng phân môn
        const key = ten_tkb + "_" + phanMon;
        
        if (!summaryMap[key]) {
            summaryMap[key] = {
                giaoVien: ten_tkb,
                phanMon: phanMon,
                monHoc: item.monHoc || "",
                tongTiet: 0,
                daKy: 0,
                chuaKy: 0
            };
        }
        
        summaryMap[key].tongTiet += 1;
        if (item.daKy) {
            summaryMap[key].daKy += 1;
        } else {
            summaryMap[key].chuaKy += 1;
        }
    });
    
    // Chuyển đổi thành mảng để xuất Excel
    const summaryArray = Object.values(summaryMap).map((item, index) => ({
        "STT": index + 1,
        "Giáo Viên": item.giaoVien,
        "Môn Học": item.monHoc,
        "Phân Môn": item.phanMon, // Thêm cột Phân môn vào file thống kê
        "Tổng Số Tiết": item.tongTiet,
        "Đã Ký SĐB": item.daKy,
        "Chưa Ký SĐB": item.chuaKy,
        "Tỷ Lệ Hoàn Thành": ((item.daKy / item.tongTiet) * 100).toFixed(1) + "%"
    }));
    
    // Tạo file Excel tổng hợp
    const worksheet = XLSX.utils.json_to_sheet(summaryArray);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "TongHopTheoGV_PhanMon");
    XLSX.writeFile(workbook, "Thong_Ke_Tong_Hop_Giao_Vien_Theo_Phan_Mon.xlsx");
}

function khóaSDBTheoTuần() {
    const tuanKey = document.getElementById('filterBCCoGiTuan').value;
    
    if (!tuanKey) {
        alert("Vui lòng chọn cụ thể một Tuần cần khóa ở ô bộ lọc bên trái!");
        return;
    }
    
    if (!confirm(`Bạn có chắc chắn muốn khóa Sổ Đầu Bài và Kế Hoạch của [ Tuần ${tuanKey} ] không? Thao tác này sẽ ghi nhận trạng thái khóa vào sheet CauHinhTuan.`)) {
        return;
    }
    
    // Gọi API thực hiện khóa trên Google Apps Script
    fetch(`${API_URL}?action=khoaTuanSDB&tuan=${encodeURIComponent(tuanKey)}`, {
        method: 'POST'
    })
    .then(res => res.json())
    .then(res => {
        if(res.success) {
            alert(`Đã khóa thành công tuần ${tuanKey} vào cột H của sheet CauHinhTuan!`);
        } else {
            alert("Lỗi: " + (res.message || "Không thể thực hiện khóa tuần."));
        }
    })
    .catch(err => {
        console.error("Lỗi kết nối:", err);
        alert("Có lỗi xảy ra khi gửi yêu cầu khóa tuần.");
    });
}
function thucHienKhoaTuan(loaiKhoa) {
    const tuanKey = document.getElementById('filterBCCoGiTuan').value;
    
    if (!tuanKey) {
        alert("Vui lòng chọn cụ thể một Tuần cần khóa ở ô bộ lọc bên trái!");
        return;
    }
    
    const tenLoai = loaiKhoa === 'KeHoach' ? 'Kế Hoạch (Cột H)' : 'Sổ Đầu Bài (Cột I)';
    
    if (!confirm(`Bạn có chắc chắn muốn khóa ${tenLoai} của [ Tuần ${tuanKey} ] không?`)) {
        return;
    }
    
    fetch(`${API_URL}?action=khoaTuanTheoLoai&tuan=${encodeURIComponent(tuanKey)}&loai=${encodeURIComponent(loaiKhoa)}`, {
        method: 'POST'
    })
    .then(res => res.json())
    .then(res => {
        if(res.success) {
            alert(`Đã khóa ${tenLoai} thành công cho tuần ${tuanKey}!`);
        } else {
            alert("Lỗi từ Server: " + (res.message || "Không rõ nguyên nhân"));
        }
    })
    .catch(err => {
        console.error("Lỗi kết nối chi tiết:", err);
        alert("Lỗi kết nối hoặc phản hồi không phải định dạng JSON: " + err.toString());
    });
}

// Hàm kiểm tra và ẩn các tab quản trị / báo cáo đối với giáo viên thường
function phanQuyenGiaoDien() {
    // Đọc thêm từ gói session chung nếu có
    let sessionData = {};
    try {
        sessionData = JSON.parse(localStorage.getItem("kienona_session") || "{}");
    } catch(e) {}

    var vaiTroUser = (localStorage.getItem("vaiTroUser") || sessionData.vaiTro || sessionData.role || "").toLowerCase();
    var maNhanSu = (localStorage.getItem("maNhanSu") || sessionData.maNhanSu || "").toLowerCase();

    // Danh sách từ khóa quản trị được phép xem
    var dsQuyenQuanTri = ["bgh", "admin", "kythuat", "hieutruong", "phohieutruong", "it", "tai"]; // Đã thêm "tai" để test
    
    var coQuyen = dsQuyenQuanTri.some(function(q) {
        return vaiTroUser.includes(q) || maNhanSu.includes(q);
    });

    if (!coQuyen) {
        var tabBaoCao = document.getElementById("tab-baocao");
        if (tabBaoCao) tabBaoCao.style.display = "none";

        var btnTaiTKB = document.getElementById("tab-admin-tkb");
        if (btnTaiTKB) btnTaiTKB.style.display = "none";

        var tabTaiPPCT = document.getElementById("tab-ppct");
        if (tabTaiPPCT) tabTaiPPCT.style.display = "none";
    }
}
